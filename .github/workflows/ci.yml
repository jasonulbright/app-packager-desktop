name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # The tests that open windows run only with this opt-in, and never on the dev PC (tests/.../WindowTestGuard.cs).
  APD_ALLOW_WINDOW_TESTS: "1"

jobs:
  check:
    name: build and test (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Set the display resolution for WPF tests
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName PresentationFramework
          $width = [System.Windows.SystemParameters]::PrimaryScreenWidth
          $height = [System.Windows.SystemParameters]::PrimaryScreenHeight
          if ($width -lt 1440 -or $height -lt 900) {
            throw "The display is ${width}x${height} DIP; WPF render tests require at least 1440x900."
          }
          $display = Get-CimInstance -ClassName Win32_VideoController |
            Where-Object { $_.CurrentHorizontalResolution -gt 0 -and $_.CurrentVerticalResolution -gt 0 } |
            Select-Object -First 1
          if ($null -eq $display) { throw 'The display pixel resolution could not be read.' }
          $pixelWidth = $display.CurrentHorizontalResolution
          $pixelHeight = $display.CurrentVerticalResolution
          if ($pixelWidth -lt 1920 -or $pixelHeight -lt 1080) {
            throw "The display is ${pixelWidth}x${pixelHeight} pixels; WPF render tests require at least 1920x1080."
          }
          Write-Host "WPF test display: ${width}x${height} DIP, ${pixelWidth}x${pixelHeight} pixels"

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/ApplicationPackagerUI/ApplicationPackagerUI.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/ApplicationPackagerBuild/ApplicationPackagerBuild.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        run: dotnet test tests/ApplicationPackagerEngine.Tests/ApplicationPackagerEngine.Tests.csproj --configuration Release --logger "trx;LogFileName=window-guard.trx"

      # The window tests are skipped unless APD_ALLOW_WINDOW_TESTS=1 reaches the test run. A run in which the opt-in
      # was lost would skip them all and still pass, so the number of skipped tests is checked.
      - name: Window tests ran
        shell: pwsh
        run: |
          $trx = Get-ChildItem tests/ApplicationPackagerEngine.Tests/TestResults -Filter window-guard.trx -Recurse | Select-Object -First 1
          if (-not $trx) { throw 'The test run wrote no window-guard.trx.' }
          [xml]$result = Get-Content -LiteralPath $trx.FullName
          $skipped = @($result.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'NotExecuted' }).Count
          $limit = 5
          Write-Host "skipped tests: $skipped (limit $limit)"
          if ($skipped -gt $limit) { throw "$skipped tests were skipped, more than $limit. Check that APD_ALLOW_WINDOW_TESTS=1 reaches the test run." }
