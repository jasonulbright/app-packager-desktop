name: ci

on:
  push:
    branches:
      - main
    # A push that changes only guide images (docs/images) skips the long build and test job. Markdown files are not skipped:
    # tests read README.md and docs/*.md (definition counts, ASCII, guide coverage, notices).
    paths-ignore:
      - 'docs/images/**'
  workflow_dispatch:
    inputs:
      filter:
        description: "Optional dotnet test filter (a fast run of some tests); empty runs everything"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  check:
    name: build and test (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # DetectionTesterParityTests compares this app with the standalone Detection Tester module. The module comes from a
      # released tag, so the test runs in CI. Move the tag when the parity test is checked against a newer release.
      - name: Check out the standalone Detection Tester
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jasonulbright/detection-tester
          ref: v2026.11.18.0025
          path: detection-tester-ref

      # The lexicon check reads the user-facing text (docs, XAML, message strings) against the ConfigMgr lexicon in tools/lexicon.
      # The files there are copies of the vault lexicon; do not edit them here. A hit with severity error or warning fails the job.
      - name: Check the text against the ConfigMgr lexicon
        shell: pwsh
        run: pwsh -NoProfile -File tools/lexicon/Invoke-LexiconCheck.ps1 -Root . -RepoType Apd -FailOn Warning


      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Set the display resolution for WPF tests
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName PresentationFramework
          $width = [System.Windows.SystemParameters]::PrimaryScreenWidth
          $height = [System.Windows.SystemParameters]::PrimaryScreenHeight
          if ($width -lt 1440 -or $height -lt 900) {
            throw "The display is ${width}x${height} DIP; WPF render tests require at least 1440x900."
          }
          $display = Get-CimInstance -ClassName Win32_VideoController |
            Where-Object { $_.CurrentHorizontalResolution -gt 0 -and $_.CurrentVerticalResolution -gt 0 } |
            Select-Object -First 1
          if ($null -eq $display) { throw 'The display pixel resolution could not be read.' }
          $pixelWidth = $display.CurrentHorizontalResolution
          $pixelHeight = $display.CurrentVerticalResolution
          if ($pixelWidth -lt 1920 -or $pixelHeight -lt 1080) {
            throw "The display is ${pixelWidth}x${pixelHeight} pixels; WPF render tests require at least 1920x1080."
          }
          Write-Host "WPF test display: ${width}x${height} DIP, ${pixelWidth}x${pixelHeight} pixels"

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/ApplicationPackagerUI/ApplicationPackagerUI.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/ApplicationPackagerBuild/ApplicationPackagerBuild.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        env:
          TEST_FILTER: ${{ inputs.filter }}
          APD_DETECTION_TESTER_DIR: ${{ github.workspace }}\detection-tester-ref
          APD_GUIDE_CAPTURE_DIR: ${{ runner.temp }}/guide-images
        run: |
          if ($env:TEST_FILTER) { dotnet test tests/ApplicationPackagerEngine.Tests/ApplicationPackagerEngine.Tests.csproj --configuration Release --filter $env:TEST_FILTER --blame --blame-hang-timeout 8m --blame-hang-dump-type mini }
          else { dotnet test tests/ApplicationPackagerEngine.Tests/ApplicationPackagerEngine.Tests.csproj --configuration Release --blame --blame-hang-timeout 8m --blame-hang-dump-type mini }

      - name: Guide images of the capture run
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: guide-images
          path: ${{ runner.temp }}\guide-images
          if-no-files-found: ignore
