name: repeat-flaky

# Temporary: runs the timing tests 20 times to show they are stable. Removed before the merge.
on:
  push:
    branches:
      - fix/flaky-timing-tests

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  repeat:
    name: repeat the timing tests (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: |
          dotnet build tests/ApplicationPackagerEngine.Tests/ApplicationPackagerEngine.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run 20 times
        shell: pwsh
        run: |
          $failed = 0
          for ($i = 1; $i -le 20; $i++) {
            dotnet test tests/ApplicationPackagerEngine.Tests/ApplicationPackagerEngine.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~SiteHygieneLiveTests|FullyQualifiedName~SettingsDurabilityTests|FullyQualifiedName~LiveHistoryAndAlertTests|FullyQualifiedName~SiteHygieneLivePageRealServiceTests"
            if ($LASTEXITCODE -ne 0) { $failed++; Write-Host "Run $i FAILED" } else { Write-Host "Run $i passed" }
          }
          Write-Host "Failed runs: $failed of 20"
          if ($failed -gt 0) { exit 1 }
